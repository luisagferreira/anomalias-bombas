name: Atualizar e Publicar Site no GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências leves para gerar o site
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Regenerar site estático em docs/ a partir dos CSVs e figuras
        run: python gerar_site_github.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload do artefato docs/
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs"

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
